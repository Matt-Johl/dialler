; Dial plan for the native PBX in lines mode (SPEC §6 item 3c).
;   from-phones: a phone (100/101) dials 2XX → the registered line, direct;
;                dials 100/101 → the other phone; dials 600 → PBX echo
;   from-lines:  the app's line dials 100/101 → ring that phone;
;                600 → PBX echo
;
; The difference from the trunk plan is one word per Dial: PJSIP/201 is a
; registered device this exchange knows, where PJSIP/201@dialler was a peer
; it forwarded to. That is the whole point of the mode.

[general]
static=yes
writeprotect=yes

; ---- Dial's outcome → the SIP status the caller should hear ----------------
; As on the trunk bench: without it a failed Dial says nothing and a phone
; that is switched off cannot be told from one that is still ringing.
[dial-status]
exten => status-CHANUNAVAIL,1,NoOp(${DEST}: no reachable contact)
 same => n,Hangup(20)                  ; subscriber absent  → 480
exten => status-NOANSWER,1,NoOp(${DEST}: rang out)
 same => n,Hangup(19)                  ; no answer          → 480
exten => status-BUSY,1,NoOp(${DEST}: busy)
 same => n,Hangup(17)                  ; user busy          → 486
exten => status-CONGESTION,1,NoOp(${DEST}: congested)
 same => n,Hangup(34)                  ; circuit congestion → 503
exten => _status-.,1,Hangup()

[from-phones]
include => dial-status
exten => _2XX,1,NoOp(Phone → line ${EXTEN})
 same => n,Set(DEST=${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Goto(status-${DIALSTATUS},1)

exten => _10X,1,NoOp(Phone → phone ${EXTEN})
 same => n,Set(DEST=${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Goto(status-${DIALSTATUS},1)

exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

[from-lines]
include => dial-status
exten => _10X,1,NoOp(Line ${CALLERID(num)} → phone ${EXTEN})
 same => n,Set(DEST=${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Goto(status-${DIALSTATUS},1)

; A line calling another line: the exchange bridges them. Not what app↔app
; does — those stay local by design (SPEC §3) — but the exchange must be
; able to, and this is what a second registered device is dialled through.
exten => _2XX,1,NoOp(Line ${CALLERID(num)} → line ${EXTEN})
 same => n,Set(DEST=${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Goto(status-${DIALSTATUS},1)

exten => 600,1,NoOp(Line → PBX echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
