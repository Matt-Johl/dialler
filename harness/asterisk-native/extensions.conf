; Dial plan for the native PBX.
;   from-phones:  a phone (100/101) dials 2XX → the light server's app users;
;                 dials 100/101 → the other phone directly on the PBX;
;                 dials 600 → PBX echo
;   from-dialler: the light server sends 100/101 → ring that phone;
;                 600 → PBX echo

[general]
static=yes
writeprotect=yes

[from-phones]
exten => _2XX,1,NoOp(Phone → Dialler user ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@dialler,30)
 same => n,Hangup()

exten => _10X,1,NoOp(Phone → phone ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

[from-dialler]
exten => _10X,1,NoOp(Dialler → phone ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Hangup()

exten => 600,1,NoOp(Dialler → PBX echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
