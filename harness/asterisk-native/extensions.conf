; Dial plan for the native PBX.
;   from-phones:  a phone (100/101) dials 2XX → the light server's app users;
;                 dials 100/101 → the other phone directly on the PBX;
;                 dials 600 → PBX echo
;   from-dialler: the light server sends 100/101 → ring that phone;
;                 600 → PBX echo

[general]
static=yes
writeprotect=yes

; ---- Dial's outcome → the SIP status the caller should hear ----------------
; Included by every context that dials. Without it a failed Dial falls
; through to a bare Hangup(): Asterisk sends nothing that says why, the
; caller is left on the ring-back it was given when the call started, and
; "nobody home" cannot be told from "still ringing" (2026-09-15: calling 101
; while it was switched off rang until the caller gave up). The cause codes
; are what res_pjsip turns into a SIP response.
[dial-status]
exten => status-CHANUNAVAIL,1,NoOp(${DEST}: no reachable contact)
 same => n,Hangup(20)                  ; subscriber absent  → 480
exten => status-NOANSWER,1,NoOp(${DEST}: rang out)
 same => n,Hangup(19)                  ; no answer          → 480
exten => status-BUSY,1,NoOp(${DEST}: busy)
 same => n,Hangup(17)                  ; user busy          → 486
exten => status-CONGESTION,1,NoOp(${DEST}: congested)
 same => n,Hangup(34)                  ; circuit congestion → 503
; ANSWER (the call happened and ended) and anything else: ordinary hangup.
exten => _status-.,1,Hangup()

[from-phones]
include => dial-status
exten => _2XX,1,NoOp(Phone → Dialler user ${EXTEN})
 same => n,Set(DEST=${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@dialler,30)
 same => n,Goto(status-${DIALSTATUS},1)

exten => _10X,1,NoOp(Phone → phone ${EXTEN})
 same => n,Set(DEST=${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Goto(status-${DIALSTATUS},1)

exten => 600,1,Answer()
 same => n,Echo()
 same => n,Hangup()

[from-dialler]
include => dial-status
exten => _10X,1,NoOp(Dialler → phone ${EXTEN})
 same => n,Set(DEST=${EXTEN})
 same => n,Dial(PJSIP/${EXTEN},30)
 same => n,Goto(status-${DIALSTATUS},1)

exten => 600,1,NoOp(Dialler → PBX echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
