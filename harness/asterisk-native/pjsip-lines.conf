; Standalone Asterisk on the LAN as the customer's PBX, in **lines** mode
; (SPEC §6 item 3c): the light server REGISTERs one third-party SIP line per
; device instead of being a trunk peer. Installed by
; `LINES=1 sh install-ubuntu.sh`; see harness/asterisk-native/README.md.
;
;   101      a physical SIP phone (Grandstream etc.), Digest, G.711
;   100      a softphone or any other test endpoint
;   201      the app's line, registered by the light server on its behalf
;
; There is deliberately no `dialler` endpoint and no `type=identify` here.
; pjsip matches an inbound request by source address before it looks at the
; From user, so a trunk identify would swallow the INVITEs our registered
; line sends and the registration would count for nothing. That is the same
; collision CUCM has, and the reason -pbx-mode is one mode or the other.
;
; Unlike the trunk config this file needs no @DIALLER_HOST@: the address the
; PBX calls us back on is whatever our REGISTER advertises.

[transport-udp]
type=transport
tos=cs3
cos=3
protocol=udp
bind=0.0.0.0:5060
local_net=192.168.0.0/16
local_net=10.0.0.0/8
local_net=172.16.0.0/12

; ---- physical SIP phone 101 -------------------------------------------------
[101]
type=endpoint
tos_audio=ef
cos_audio=5
context=from-phones
disallow=all
allow=g722
allow=ulaw
allow=alaw
auth=101
aors=101
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
callerid="SIP phone" <101>

[101]
type=auth
auth_type=userpass
username=101
password=dialler101

[101]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30
qualify_timeout=3.0
remove_unavailable=yes

; ---- softphone 100 ----------------------------------------------------------
[100]
type=endpoint
tos_audio=ef
cos_audio=5
context=from-phones
disallow=all
allow=g722
allow=ulaw
allow=alaw
auth=100
aors=100
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
callerid="Softphone" <100>

[100]
type=auth
auth_type=userpass
username=100
password=harness

[100]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30
qualify_timeout=3.0
remove_unavailable=yes

; ---- the app's line, registered by the light server -------------------------
; One of these per device, named by its extension. To add a second phone,
; copy the three sections below with its number and its own password, and
; give the server its credential:
;
;   curl -sSk -X POST https://127.0.0.1:8080/v1/admin/devices/<dev>/pbx-line \
;     -H 'Authorization: Bearer harness' \
;     -d '{"digest_user":"line202","secret":"dialler-line-202"}'
;
; `auth=` also makes Asterisk challenge the INVITEs this line SENDS, which
; is the half a trunk never exercises and which CUCM does too. If the
; credential is wrong, outbound calls fail with "Failed to authenticate" in
; the Asterisk log while the registration says "refused" in ours.
;
; `rewrite_contact=no` on purpose: a phone behind NAT lies about its address
; and needs the rewrite, but here the point is to prove the Contact the
; server puts in its REGISTER is one the PBX can actually call back.

[201]
type=endpoint
tos_audio=ef
cos_audio=5
context=from-lines
disallow=all
allow=g722
allow=ulaw
allow=alaw
auth=201-line
aors=201
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=no
allow_transfer=yes

[201-line]
type=auth
auth_type=userpass
username=line201
password=dialler-line-201

[201]
type=aor
max_contacts=1
remove_existing=yes
; The exchange polls a registered line exactly as it polls a desk phone, and
; drops a contact that stops answering. The server's trunk listener answers
; OPTIONS, so this also proves that end of it.
qualify_frequency=30
qualify_timeout=3.0
remove_unavailable=yes
