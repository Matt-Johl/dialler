; Standalone Asterisk on an Ubuntu box on the LAN as the customer's PBX, so
; that a real SIP phone can register to it (no Docker UDP proxy in the media
; path — see harness/asterisk-native/README.md).
;
;   101      a physical SIP phone (Grandstream etc.), Digest, G.711
;   100      a softphone or any other test endpoint
;   dialler  the light server (make dev-server on the Mac) as a trunk peer,
;            trusted by address; it listens for trunk calls on :5062/udp
;
; @DIALLER_HOST@ is substituted by install-ubuntu.sh with the light server's
; LAN address.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060
; Everything is one LAN, nothing is behind NAT, so no external_* rewriting
; is needed.
local_net=192.168.0.0/16
local_net=10.0.0.0/8
local_net=172.16.0.0/12

; ---- physical SIP phone 101 -------------------------------------------------
[101]
type=endpoint
context=from-phones
disallow=all
allow=ulaw
allow=alaw
auth=101
aors=101
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
; The name the app shows for calls from this phone: Asterisk sends it as the
; From display name. Change it here to change what the app displays.
callerid="SIP phone" <101>

[101]
type=auth
auth_type=userpass
username=101
password=dialler101

[101]
type=aor
max_contacts=1
remove_existing=yes
qualify_frequency=30

; ---- softphone 100 ----------------------------------------------------------
[100]
type=endpoint
context=from-phones
disallow=all
allow=ulaw
allow=alaw
auth=100
aors=100
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes
callerid="Softphone" <100>

[100]
type=auth
auth_type=userpass
username=100
password=harness

[100]
type=aor
max_contacts=1
remove_existing=yes

; ---- dialler light server as trunk peer -----------------------------------
[dialler]
type=endpoint
context=from-dialler
disallow=all
allow=ulaw
allow=alaw
aors=dialler
direct_media=no
rtp_symmetric=yes

[dialler]
type=aor
; The server's trunk listener (make dev-server: -trunk-addr :5062).
contact=sip:@DIALLER_HOST@:5062
qualify_frequency=10

[dialler]
type=identify
endpoint=dialler
; Calls from the server come from this host on the trunk listener's port;
; a phone on the LAN has its own address, so this cannot match a phone.
match=@DIALLER_HOST@
