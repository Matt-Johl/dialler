; Dial plan for the harness PBX.
;   from-phones:  desk phone 100 dials 2XX → handed to the dialler trunk
;   from-dialler: dialler sends 100 → rings the desk phone

[general]
static=yes
writeprotect=yes

[from-phones]
exten => _2XX,1,NoOp(Desk phone → Dialler user ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@dialler,30)
 same => n,Hangup()

[from-dialler]
exten => 100,1,NoOp(Dialler → desk phone 100)
 same => n,Dial(PJSIP/100,30)
 same => n,Hangup()

; 600: the PBX echoes the caller's audio back — the trunk-leg counterpart of
; the server's own "echo" destination (which needs no PBX at all).
exten => 600,1,NoOp(Dialler → PBX echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
