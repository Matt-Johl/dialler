; SIP over TLS on the trunk leg, appended to pjsip.conf when the image is
; built with ASTERISK_TLS=yes (SPEC §6 near-term item 3b). The Dockerfile
; also points the [dialler] endpoint and AOR at this transport.
;
; Shaped after a CUCM secure SIP trunk rather than the loosest thing that
; works: mutual authentication, both sides verified against a private CA,
; TLS 1.2. If the server can talk to this, the CUCM profile holds no
; surprises beyond the ones §9 already lists.
;
; Certificates come from harness/tls/gen_certs.sh, mounted read-only at
; /tls by docker-compose.yml.

[transport-tls]
type=transport
tos=cs3
cos=3
protocol=tls
bind=0.0.0.0:5061
cert_file=/tls/asterisk.pem
priv_key_file=/tls/asterisk.key
ca_list_file=/tls/ca.pem
; TLS 1.2, which is what CUCM's secure trunks speak. Asterisk's "method"
; names an exact version here, not a floor.
method=tlsv1_2
; Mutual TLS in both directions: verify the certificate the server presents
; when it connects to us (verify_client), demand that it present one at all
; (require_client_cert), and verify the one we are shown when we connect to
; it (verify_server). Any of these left off and the trunk would still carry
; calls — over a connection that authenticates nobody, which is the failure
; this whole item exists to close.
verify_client=yes
require_client_cert=yes
verify_server=yes
