; Asterisk as the customer's PBX. Two things live here:
;   * extension 100: a SIPp/softphone "desk phone" registered to Asterisk
;   * dialler: the light server as a trunk peer, trusted by hostname
; The trunk leg uses plain UDP, the SIP default most PBXs speak: the
; TLS-only rule (SPEC §4.4) applies to the app leg, and the trunk leg
; follows whatever the PBX offers.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; ---- desk phone 100 --------------------------------------------------------
[100]
type=endpoint
context=from-phones
disallow=all
allow=ulaw
allow=alaw
auth=100
aors=100
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[100]
type=auth
auth_type=userpass
username=100
password=harness

[100]
type=aor
max_contacts=1
remove_existing=yes

; ---- dialler light server as trunk peer -----------------------------------
[dialler]
type=endpoint
context=from-dialler
disallow=all
allow=ulaw
allow=alaw
aors=dialler
direct_media=no
rtp_symmetric=yes
; The server hands a transfer to us (REFER on the trunk leg) when both
; parties are on this PBX, so it can leave the media path. pjsip's default
; is yes; stated so nobody turns it off by accident.
allow_transfer=yes

[dialler]
type=aor
; By address: Asterisk's SIP stack resolves contact hosts with its own
; resolver, which does not see compose's DNS names (the identify section
; has the same problem), so the server's address is fixed in
; docker-compose.yml. UDP, the SIP default: Asterisk qualifies and dials
; over UDP regardless of a transport parameter here.
contact=sip:172.30.0.10:5060
; Asterisk qualifies the trunk with OPTIONS and will not dial an
; Unreachable contact; a short interval recovers quickly from the startup
; race where the server's trunk listener comes up after the first probe.
qualify_frequency=5

[dialler]
type=identify
endpoint=dialler
; Inbound INVITEs from the light server are matched to this endpoint by
; source address. Asterisk resolves `match` only at load, before the
; compose DNS name is reliably resolvable, so the address is fixed in
; docker-compose.yml.
match=172.30.0.10
match=dialler
