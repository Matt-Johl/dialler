; Asterisk as the customer's PBX. Two things live here:
;   * extension 100: a SIPp/softphone "desk phone" registered to Asterisk
;   * dialler: the light server as a trunk peer, trusted by hostname
; The trunk leg uses TCP: the TLS-only rule (SPEC §4.4) applies to the app
; leg, and the trunk leg follows whatever the PBX offers.

[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5060

[transport-tcp]
type=transport
protocol=tcp
bind=0.0.0.0:5060

; ---- desk phone 100 --------------------------------------------------------
[100]
type=endpoint
context=from-phones
disallow=all
allow=ulaw
allow=alaw
auth=100
aors=100
direct_media=no
rtp_symmetric=yes
force_rport=yes
rewrite_contact=yes

[100]
type=auth
auth_type=userpass
username=100
password=harness

[100]
type=aor
max_contacts=1
remove_existing=yes

; ---- dialler light server as trunk peer -----------------------------------
[dialler]
type=endpoint
context=from-dialler
disallow=all
allow=ulaw
allow=alaw
aors=dialler
direct_media=no
rtp_symmetric=yes

[dialler]
type=aor
contact=sip:dialler:5060;transport=tcp
qualify_frequency=30

[dialler]
type=identify
endpoint=dialler
match=dialler
