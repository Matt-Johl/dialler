# Headless validation harness (SPEC §7.2): the light server, an Asterisk PBX
# peer, SIPp for protocol conformance, and two headless baresip phones.
#
#   docker compose -f harness/docker-compose.yml up --build dialler asterisk
#   docker compose -f harness/docker-compose.yml --profile test run --rm sipp
#   docker compose -f harness/docker-compose.yml --profile test up baresip-a baresip-b
#
# See harness/README.md. This file has not been executed in the environment
# that wrote it (no Docker socket access); expect first-run fixes.
name: dialler-harness

services:
  dialler:
    build:
      context: ..
      dockerfile: harness/dialler/Dockerfile
    command:
      - -signal-addr=:7443
      - -sip-addr=:5061
      - -http-addr=:8080
      - -admin-token=harness
      # The host apps register SIP to. Inside the compose network "dialler"
      # resolves; a phone needs the Mac's LAN address:
      #   DIALLER_PUBLIC_HOST=$(ipconfig getifaddr en0) make harness-up
      - -public-host=${DIALLER_PUBLIC_HOST:-dialler}
      - -local-domain=dialler
      - -data-dir=/data
      - -ring-timeout=30s
      # Host-side ports are overridable so this harness can run next to a
      # native `make dev-server` (DIALLER_SIGNAL_HOSTPORT / SIP_HOSTPORT /
      # HTTP_HOSTPORT / RTP_MIN / RTP_MAX); the RTP range is published 1:1.
      - -rtp-min=${DIALLER_RTP_MIN:-20000}
      - -rtp-max=${DIALLER_RTP_MAX:-20100}
      - -public-sip-port=${DIALLER_SIP_HOSTPORT:-5061}
      - -rewrite-contact=${DIALLER_REWRITE_CONTACT:-true} # false only to prove harness-call-nat fails without it
      - -sip-trace=${DIALLER_SIP_TRACE:-false} # every SIP message in the server log
      # PBX leg (SPEC §4.4 rule 7): Asterisk as a SIP trunk peer over UDP
      # (the SIP default); the server listens for trunk-originated calls
      # on :5060/udp.
      - -trunk=${DIALLER_TRUNK:-sip:172.30.0.20:5060;transport=udp}
      - -trunk-addr=:5060
      # Off here on purpose: Docker Desktop's UDP port proxy rewrites a LAN
      # phone's RTP source, and replies to that rewritten source are not
      # delivered, so learning the source (symmetric RTP) silences the phone
      # after its first packet. Phones on this harness are reachable at their
      # SDP address directly. Production default is on (NAT'd phones).
      - -rtp-symmetric=${DIALLER_RTP_SYMMETRIC:-false}
      - -log-level=${DIALLER_LOG_LEVEL:-info} # debug shows the relay's RTP source learning
    volumes:
      - dialler-data:/data
    networks:
      default:
        ipv4_address: 172.30.0.10
    ports:
      - "${DIALLER_SIGNAL_HOSTPORT:-7443}:7443"
      - "${DIALLER_SIP_HOSTPORT:-5061}:5061"
      - "${DIALLER_HTTP_HOSTPORT:-8080}:8080" # directory + admin API; reachable from devices on the LAN (token-protected)
      - "${DIALLER_RTP_MIN:-20000}-${DIALLER_RTP_MAX:-20100}:${DIALLER_RTP_MIN:-20000}-${DIALLER_RTP_MAX:-20100}/udp" # relayed media, so phones (and containers via the host address) reach it

  asterisk:
    build: ./asterisk
    depends_on: [dialler]
    networks:
      default:
        ipv4_address: 172.30.0.20
    ports:
      - "5060:5060/udp"

  # Desk phone 100: registers to Asterisk (UDP, Digest), G.711 only — the
  # far side of the trunk leg for harness/trunk_test.sh.
  baresip-c:
    build: ./baresip
    profiles: [test]
    depends_on: [asterisk]
    environment:
      SIP_USER: "100"
      SIP_DOMAIN: asterisk
      TRANSPORT: udp
      AUTH_USER: "100"
      AUTH_PASS: harness
      CODECS: PCMU/8000/1,PCMA/8000/1
      OUTBOUND: asterisk:5060
    volumes:
      - ./baresip/media:/media

  sipp:
    build: ./sipp
    profiles: [test]
    depends_on: [dialler]
    volumes:
      - ./sipp/scenarios:/scenarios:ro
    environment:
      DIALLER_HOST: dialler
      DIALLER_SIP_PORT: "5061"

  baresip-a:
    build: ./baresip
    profiles: [test]
    depends_on: [dialler]
    environment:
      SIP_USER: "201"
      SIP_DOMAIN: dialler
      # App-leg SIP Digest: the enrolled device's id and fixed dev token
      # (harness/provision.sh).
      AUTH_USER: dev-a
      AUTH_PASS: tok_dev_a_harness_fixed
      # The trunk transfer test recreates this phone silent, so the desk
      # phone's recording can only contain audio the PBX sent it.
      AUDIO_SOURCE: ${AUDIO_SOURCE:-aufile,/media/in.wav}
    volumes:
      - ./baresip/media:/media

  baresip-b:
    build: ./baresip
    profiles: [test]
    depends_on: [dialler]
    environment:
      SIP_USER: "202"
      SIP_DOMAIN: dialler
      AUTH_USER: dev-b
      AUTH_PASS: tok_dev_b_harness_fixed
      REGINT: "${BARESIP_B_REGINT:-300}" # 0 → starts unregistered (wake test)
      # Set to <mac-ip>:5061 to register with a server running natively on
      # the Mac instead of the dialler container (harness/ring_native.sh).
      OUTBOUND: "${BARESIP_B_OUTBOUND:-}"
    volumes:
      - ./baresip/media:/media

volumes:
  dialler-data: {}

# Fixed addresses: Asterisk identifies the light server as its trunk peer
# by source address (pjsip.conf `match=`), which it resolves only at load,
# so the server's address must be known and stable.
networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24
