{{define "content"}}
<a class="crumb" href="/devices/{{.Device.DeviceID}}">{{icon "back"}}{{if .Device.Label}}{{.Device.Label}}{{else}}Extension {{.Device.User}}{{end}}</a>
<header class="page">
  <div><h1>{{if .IsNew}}Add a contact{{else}}Edit contact{{end}}</h1></div>
</header>

<form method="post" action="{{.Action}}" class="narrow">
  <input type="hidden" name="_csrf" value="{{.CSRF}}">
  <dl class="props">
    <div class="prop">
      <dt><label for="display_name">Name</label></dt>
      <dd><input id="display_name" name="display_name" value="{{.Contact.DisplayName}}" required autofocus></dd>
    </div>
    <div class="prop">
      <dt><label for="uri">Number</label></dt>
      <dd><input id="uri" name="uri" value="{{.Contact.URI}}" class="mono" required placeholder="100, or sip:100@pbx"><span class="hint">A bare number is an extension here</span></dd>
    </div>
    <div class="prop">
      <dt>Reached via</dt>
      <dd class="choices">
        <label class="choice"><input type="radio" name="mode" value="local" {{if ne .Contact.Mode "trunk"}}checked{{end}}> This server</label>
        <label class="choice"><input type="radio" name="mode" value="trunk" {{if eq .Contact.Mode "trunk"}}checked{{end}}> The PBX</label>
      </dd>
    </div>
    <div class="prop last">
      <dt>Favourite</dt>
      <dd><label class="choice"><input type="checkbox" name="favourite" {{if .Contact.Favourite}}checked{{end}}> Pinned at the top of the phone's directory</label></dd>
    </div>
  </dl>
  <div class="form-actions">
    <button type="submit" class="btn primary">{{if .IsNew}}Add contact{{else}}Save{{end}}</button>
    <a class="btn ghost" href="/devices/{{.Device.DeviceID}}">Cancel</a>
    {{if not .IsNew}}<span class="spacer" style="flex:1"></span>{{end}}
  </div>
</form>
{{if not .IsNew}}
<form method="post" action="/devices/{{.Device.DeviceID}}/contacts/{{.Contact.ID}}/delete" class="form-actions">
  <input type="hidden" name="_csrf" value="{{.CSRF}}">
  <button type="submit" class="btn danger ghost">{{icon "trash"}}Delete this contact</button>
</form>
{{end}}
{{end}}
