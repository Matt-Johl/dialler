{{define "content"}}
<a class="crumb" href="/devices/{{.Device.DeviceID}}">{{icon "back"}}{{.Device.DeviceID}}</a>
<header class="page">
  <div><h1>Copy the directory</h1><p class="sub">Each chosen device's list is replaced with this one's {{.Count}} contact{{if ne .Count 1}}s{{end}}.</p></div>
</header>

<form method="post" action="/devices/{{.Device.DeviceID}}/directory/copy" class="pane">
  <input type="hidden" name="_csrf" value="{{.CSRF}}">
  {{if .Others}}
  <div class="choices">
  {{range .Others}}
    <label class="choice"><input type="checkbox" name="to" value="{{.DeviceID}}"> <span class="mono">{{.DeviceID}}</span> <span class="muted">ext {{.User}}</span></label>
  {{end}}
  </div>
  <div class="form-actions">
    <button type="submit" class="btn primary">Copy directory</button>
    <a class="btn ghost" href="/devices/{{.Device.DeviceID}}">Cancel</a>
  </div>
  {{else}}
  <p class="section-note">There are no other devices to copy to.</p>
  <div class="form-actions"><a class="btn ghost" href="/devices/{{.Device.DeviceID}}">Back</a></div>
  {{end}}
</form>
{{end}}
