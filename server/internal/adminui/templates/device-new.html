{{define "content"}}
<a class="crumb" href="/">{{icon "back"}}Devices</a>
<header class="page">
  <div><h1>Add a device</h1><p class="sub">You'll get its enrolment code and QR right after.</p></div>
</header>

<form method="post" action="/devices" class="narrow">
  <input type="hidden" name="_csrf" value="{{.CSRF}}">
  <dl class="props">
    <div class="prop">
      <dt><label for="user">Extension</label></dt>
      <dd><input id="user" name="user" value="{{.User}}" placeholder="201" inputmode="numeric" autocomplete="off" required autofocus class="narrow"><span class="hint">The number it answers as</span></dd>
    </div>
    <div class="prop last">
      <dt><label for="label">Name</label></dt>
      <dd><input id="label" name="label" value="{{.Label}}" placeholder="Matt's iPhone" autocomplete="off"><span class="hint">Optional</span></dd>
    </div>
  </dl>
  <div class="form-actions">
    <button type="submit" class="btn primary">Add device</button>
    <a class="btn ghost" href="/">Cancel</a>
  </div>
</form>
{{end}}
