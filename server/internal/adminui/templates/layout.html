<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Dialler</title>
<link rel="stylesheet" href="/static/app.css">
<script src="/static/app.js" defer></script>
</head>
<body class="{{if .SignedIn}}shell{{else}}bare{{end}}">
{{if .SignedIn}}
<aside class="side">
  <a class="brand" href="/"><span class="brand-mark" aria-hidden="true"></span>Dialler</a>
  <nav class="side-nav">
    <a href="/" {{if or (eq .Path "/") (eq .Path "/devices/new")}}aria-current="page"{{end}}>Devices</a>
    <a href="/server" {{if eq .Path "/server"}}aria-current="page"{{end}}>Server</a>
  </nav>
  <form method="post" action="/logout" class="side-foot">
    <input type="hidden" name="_csrf" value="{{.CSRF}}">
    <button type="submit" class="ghost">Sign out</button>
  </form>
</aside>
{{end}}
<main class="content">
  {{if .Notice}}<div class="flash notice" role="status">{{.Notice}}</div>{{end}}
  {{if .Error}}<div class="flash error" role="alert">{{.Error}}</div>{{end}}
  {{template "content" .}}
</main>
</body>
</html>
