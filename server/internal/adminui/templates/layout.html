<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.Title}} · Dialler</title>
<link rel="stylesheet" href="/static/app.css">
</head>
<body>
<header class="top">
  <a class="wordmark" href="/">Dialler</a>
  {{if .SignedIn}}
  <nav>
    <a href="/" {{if eq .Path "/"}}aria-current="page"{{end}}>Devices</a>
    <a href="/server" {{if eq .Path "/server"}}aria-current="page"{{end}}>Server</a>
    <form method="post" action="/logout" class="inline">
      <input type="hidden" name="_csrf" value="{{.CSRF}}">
      <button type="submit" class="link">Sign out</button>
    </form>
  </nav>
  {{end}}
</header>
<main>
  {{if .Notice}}<p class="flash notice">{{.Notice}}</p>{{end}}
  {{if .Error}}<p class="flash error">{{.Error}}</p>{{end}}
  {{template "content" .}}
</main>
</body>
</html>
