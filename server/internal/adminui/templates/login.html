{{template "header" .}}
<section class="card narrow">
  <h1>Sign in</h1>
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{.Data.Next}}">
    <input type="hidden" name="resume" value="{{.Data.Resume}}">
    <label>Operator password <input type="password" name="password" autofocus autocomplete="current-password" required></label>
    <button>Sign in</button>
  </form>
</section>
{{template "footer" .}}
