{{template "header" .}}
<div class="login">
<section class="card">
  <div class="brand">Dialler</div>
  <p class="lede">Operator sign in</p>
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{.Data.Next}}">
    <input type="hidden" name="resume" value="{{.Data.Resume}}">
    <label>Password <input type="password" name="password" autofocus autocomplete="current-password" required></label>
    <button>Sign in</button>
  </form>
</section>
</div>
{{template "footer" .}}
