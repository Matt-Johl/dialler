{{template "header" .}}
<div class="login">
<section class="card">
  <div class="brand"><svg viewBox="0 0 1024 1024" aria-hidden="true"><g transform="translate(512 512) rotate(-45)"><rect x="-500" y="-35" width="1000" height="70"/><rect x="-450" y="-140" width="340" height="70"/><rect x="-390" y="-245" width="200" height="70"/><rect x="110" y="70" width="340" height="70"/><rect x="190" y="175" width="200" height="70"/></g></svg>Dialler</div>
  <p class="lede">Operator sign in</p>
  <form method="post" action="/login">
    <input type="hidden" name="next" value="{{.Data.Next}}">
    <input type="hidden" name="resume" value="{{.Data.Resume}}">
    <label>Username <input name="username" autofocus autocomplete="username" required value="{{.Data.Username}}"></label>
    <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
    <button>Sign in</button>
  </form>
</section>
</div>
{{template "footer" .}}
